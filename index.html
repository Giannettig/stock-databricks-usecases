<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revolt BI × Stock — Use Cases on Databricks</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif;
    background: #0A0A0A;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .gate {
    text-align: center;
    max-width: 400px;
    padding: 40px;
  }
  .gate h1 {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .gate h1 span { color: #EBA52D; }
  .gate p {
    color: #B0B8C0;
    font-size: 14px;
    margin-bottom: 32px;
  }
  .gate input {
    width: 100%;
    padding: 14px 16px;
    border-radius: 8px;
    border: 1px solid #2A2A2A;
    background: #141414;
    color: #fff;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    outline: none;
    margin-bottom: 16px;
    transition: border-color 0.15s;
  }
  .gate input:focus { border-color: #EBA52D; }
  .gate button {
    width: 100%;
    padding: 14px;
    border-radius: 8px;
    border: none;
    background: #EBA52D;
    color: #000;
    font-size: 14px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: background 0.15s;
  }
  .gate button:hover { background: #d4922a; }
  .gate .error {
    color: #ff4444;
    font-size: 12px;
    margin-top: 8px;
    display: none;
  }
  .gate .footer {
    margin-top: 32px;
    font-size: 11px;
    color: #6A7480;
  }
</style>
</head>
<body>
<div class="gate">
  <h1>Revolt BI <span>× Stock</span></h1>
  <p>This content is password-protected.<br>Enter the access code to continue.</p>
  <input type="password" id="pw" placeholder="Access code" autofocus
    onkeydown="if(event.key==='Enter')check()">
  <button onclick="check()">Enter</button>
  <div class="error" id="err">Incorrect code. Try again.</div>
  <div class="footer">Revolt BI — Confidential</div>
</div>
<script>
function check() {
  var pw = document.getElementById('pw').value;
  // Simple hash check (not crypto-secure, just a gate)
  if (pw === atob('c3RvY2syMDI2')) {
    sessionStorage.setItem('stock_auth', '1');
    window.location.href = 'landing.html';
  } else {
    document.getElementById('err').style.display = 'block';
  }
}
// Auto-redirect if already authenticated
if (sessionStorage.getItem('stock_auth') === '1') {
  window.location.href = 'landing.html';
}
</script>
</body>
</html>
